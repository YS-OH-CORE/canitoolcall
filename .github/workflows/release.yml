# Build and publish to PyPI with trusted publishing (OIDC; no API token).
# Run it manually: Actions > release > Run workflow, and pick a v* TAG in
# "Use workflow from". The tag must equal the package version (v0.1.0 for
# __version__ = "0.1.0"). One-time setup is described in docs/PUBLISHING.md.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  build:
    name: test + build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync
      - name: lint, types, tests
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy
          uv run canitoolcall validate
          uv run pytest
      - name: uv build
        run: uv build
      - name: tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [ -f "dist/canitoolcall-${version}.tar.gz" ]; then
            echo "::error::tag $TAG does not match the built version:"; ls dist; exit 1
          fi
      - name: twine check
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/canitoolcall/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
