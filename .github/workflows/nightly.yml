# Nightly matrix: build each engine's isolated environment with its pinned
# setup script, replay the whole fixture corpus through the engine's own
# parsers, build the static matrix site from the results files, and deploy it
# to GitHub Pages. No secrets are needed: engines, tokenizers and templates are
# public, and no model weights are downloaded. An optional HF_TOKEN repository
# secret raises the Hub's anonymous rate limit for the cache prefetch; replays
# themselves run with HF_HUB_OFFLINE=1.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-matrix
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  run:
    name: run ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [vllm, sglang, llamacpp, transformers, ollama]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.engine == 'ollama'
        with:
          # Ollama's go.mod at the pinned commit says "go 1.26.0"; GOTOOLCHAIN=auto
          # in scripts/engines/ollama.sh still honours a newer toolchain line.
          go-version: "1.26.0"
          cache: false
      - name: Cache tokenizer and template files (never weights)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.engine }}-${{ hashFiles('fixtures/*/family.json') }}
          restore-keys: hf-${{ matrix.engine }}-
      - name: Cache engine checkout and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .engines/${{ matrix.engine }}
          key: engine-${{ matrix.engine }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('scripts/engines/{0}.sh', matrix.engine), format('harnesses/{0}/**', matrix.engine)) }}
      # Vocab-only GGUFs (tokenizer + chat template, no tensors: never weights) from
      # llama.cpp's converter at the pinned commit. The llama.cpp setup script makes
      # them (skipping those already up to date); the Ollama adapter reads the same
      # files, so its job makes them with the converter alone unless this cache,
      # shared by both jobs and keyed on everything the GGUFs depend on, has them.
      # No restore-keys: a partial or stale set is rebuilt, never reused.
      - name: Cache vocab-only GGUFs (never weights)
        id: gguf-cache
        if: matrix.engine == 'llamacpp' || matrix.engine == 'ollama'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .engines/gguf
          key: gguf-vocab-${{ runner.os }}-${{ hashFiles('fixtures/*/family.json', 'fixtures/*/*.jsonl', 'scripts/engines/llamacpp.sh', 'scripts/engines/gguf_vocab.sh', 'src/canitoolcall/adapters/base.py') }}
      - name: Set up ${{ matrix.engine }}
        id: setup
        run: |
          script="scripts/engines/${ENGINE}.sh"
          if [ ! -f "$script" ]; then
            echo "::notice title=${ENGINE} not run::no setup script ($script); this engine gets no column tonight"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$script"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Make vocab-only GGUFs for Ollama (llama.cpp converter only)
        if: matrix.engine == 'ollama' && steps.setup.outputs.ready == 'true' && steps.gguf-cache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/engines/llamacpp.sh --no-harness
      - name: Prefetch pinned tokenizer and template files
        if: steps.setup.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --no-project --with huggingface-hub==1.33.0 python scripts/engines/prefetch_hf.py
      - name: Replay the fixtures
        if: steps.setup.outputs.ready == 'true'
        run: |
          set +e
          uv run canitoolcall run --engine "$ENGINE" --out results --env HF_HUB_OFFLINE=1
          code=$?
          set -e
          # 0: everything passed. 1: conformance failures, which are the data this
          # workflow exists to publish. 2: usage or harness error, which fails the job.
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Upload results
        if: ${{ !cancelled() && steps.setup.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.engine }}
          path: results/*.json
          if-no-files-found: warn
          retention-days: 90

  site:
    name: build matrix site
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Refuse to publish an empty matrix
        run: |
          mkdir -p results
          if ! compgen -G "results/*.json" > /dev/null; then
            echo "::error::no engine produced a results file; keeping the previously deployed site"
            exit 1
          fi
          ls -l results
      - name: Build the site from the results files
        run: uv run canitoolcall matrix --results results --out site/_build
      - name: Publish the agent-facing files next to the matrix
        # llms.txt at the site root is where agents look for it (https://llmstxt.org).
        run: cp llms.txt AGENTS.md site/_build/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_build

  deploy:
    name: deploy to GitHub Pages
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
