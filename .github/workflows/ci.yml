# Lint, type-check and test on every pull request and on pushes to main.
# Engine tests (@pytest.mark.engine) skip themselves here: no engine venvs are
# built in CI; the nightly workflow runs the real engines.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - name: ruff check
        run: uv run ruff check src tests scripts
      - name: ruff format
        run: uv run ruff format --check src tests scripts
      - name: mypy
        run: uv run mypy
      - name: validate fixtures against the spec
        run: uv run canitoolcall validate

  test:
    name: pytest (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest

  build:
    name: build + twine check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: uv build
        run: uv build
      - name: twine check
        run: uvx twine check --strict dist/*
      - name: smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/canitoolcall --version
          /tmp/smoke/bin/canitoolcall validate
          /tmp/smoke/bin/canitoolcall engines
          /tmp/smoke/bin/canitoolcall matrix --results results/2026-09-25 --out /tmp/smoke-site
          test -f /tmp/smoke-site/index.html
