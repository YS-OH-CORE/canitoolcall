[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "canitoolcall"
dynamic = ["version", "readme"]
description = "caniuse.com for tool calling: a neutral conformance suite for tool-call and reasoning parsers across open-weight model families and inference engines."
license = "Apache-2.0"
# Third-party texts the fixture corpus and harness require to travel with every copy.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
requires-python = ">=3.10"
authors = [{ name = "CanIToolCall contributors" }]
keywords = ["llm", "tool-calling", "function-calling", "conformance", "vllm", "sglang", "llama.cpp", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]
# Core stays light on purpose: the adapter worker imports canitoolcall inside
# each engine's isolated venv, so the modules it needs (fixtures, chunking,
# results, adapters.base, adapters.worker) must import with the stdlib only.
# Third-party libraries below are imported lazily where they are used.
dependencies = [
    "jsonschema>=4.23",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Per-engine extras. Only engines that pip can install on every platform get one.
#   transformers: pure Python, so `pip install canitoolcall[transformers]` is a working replay env.
#   vllm / sglang: deliberately NOT extras. Their PyPI wheels are Linux-only and pin CUDA stacks
#     (sglang 0.5.20 even pins the pre-release cuda-tile==1.6.0rc5), so a universal lock cannot resolve
#     them, and the adapters never import them from this env anyway. scripts/engines/<engine>.sh pins
#     the version and builds the isolated .venvs/<engine> (vllm==0.30.0, sglang==0.5.20).
#   llamacpp / ollama: compiled harnesses (harnesses/<engine>/), built by scripts/engines/<engine>.sh.
transformers = ["transformers==5.17.0", "jmespath>=1.0"]

[project.scripts]
canitoolcall = "canitoolcall.cli:main"

[project.entry-points.pytest11]
canitoolcall = "canitoolcall.pytest_plugin"

[project.urls]
Homepage = "https://github.com/redd34/canitoolcall"
Issues = "https://github.com/redd34/canitoolcall/issues"
Changelog = "https://github.com/redd34/canitoolcall/blob/main/CHANGELOG.md"
Matrix = "https://redd34.github.io/canitoolcall/"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema",
]

[tool.hatch.version]
path = "src/canitoolcall/__init__.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# PyPI shows the README without the repository: turn relative links into absolute
# GitHub links on the main branch of redd34/canitoolcall.
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/redd34/canitoolcall/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/canitoolcall"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the spec and the fixture corpus inside the wheel so engines can vendor
# the suite via the pytest plugin without cloning this repo.
"spec" = "canitoolcall/_data/spec"
"fixtures" = "canitoolcall/_data/fixtures"
# `canitoolcall matrix` from an installed wheel (matrix.default_templates_dir falls back here).
"site/templates" = "canitoolcall/_data/templates"

[tool.hatch.build.targets.sdist]
# Anchored ("/x"): unanchored patterns match at any depth (e.g. results/*/README.md).
include = [
    "/src",
    "/spec",
    "/fixtures",
    "/tests",
    "/docs",
    "/scripts",
    "/harnesses",
    "/site/templates",
    "/README.md",
    "/LICENSE",
    "/LICENSES",
    "/THIRD_PARTY_NOTICES.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "engine(name): test needs a real engine environment (skipped when unavailable)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
# Committed results snapshots keep the one-off triage/repro scripts exactly as run.
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/canitoolcall"]
